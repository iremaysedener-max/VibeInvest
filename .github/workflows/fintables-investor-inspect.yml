name: Temporary TEFAS investor history export

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clients
        run: pip install tefas-client==2.1.1 curl_cffi
      - name: Export investor history
        run: |
          mkdir -p out
          python - <<'PY'
          import json, traceback
          from datetime import date

          out = {"client": {}, "curl_cffi": {}, "errors": []}

          # Preferred route: maintained TEFAS client using the official JSON API.
          try:
              from tefas_client import Tefas
              with Tefas(timeout=60) as tefas:
                  windows = {
                      "baseline": (date(2026, 4, 20), date(2026, 5, 1)),
                      "current": (date(2026, 7, 20), date(2026, 7, 31)),
                  }
                  for label, (start, end) in windows.items():
                      funds = tefas.fetch(
                          fund_type="YAT",
                          start_date=start,
                          end_date=end,
                      )
                      out["client"][label] = {
                          code: [
                              {
                                  "date": h.date.isoformat(),
                                  "price": h.price,
                                  "market_cap": h.market_cap,
                                  "number_of_shares": h.number_of_shares,
                                  "number_of_investors": h.number_of_investors,
                              }
                              for h in fund.history
                          ]
                          for code, fund in funds.items()
                      }
                      print(label, "funds", len(funds))
          except Exception as exc:
              out["errors"].append({"route": "tefas-client", "error": repr(exc), "trace": traceback.format_exc()})

          # Fallback route: Chrome TLS impersonation against the same official endpoint.
          try:
              from curl_cffi import requests
              url = "https://www.tefas.gov.tr/api/funds/fonGnlBlgSiraliGetir"
              headers = {
                  "Origin": "https://www.tefas.gov.tr",
                  "Referer": "https://www.tefas.gov.tr/tr/fon-verileri",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "tr-TR,tr;q=0.9,en;q=0.8",
                  "Content-Type": "application/json",
              }
              for label, start, end in [
                  ("baseline", "20260420", "20260501"),
                  ("current", "20260720", "20260731"),
              ]:
                  payload = {
                      "fonTipi": "YAT",
                      "fonKodu": None,
                      "aramaMetni": None,
                      "fonTurKod": None,
                      "fonGrubu": None,
                      "sfonTurKod": None,
                      "basTarih": start,
                      "bitTarih": end,
                      "basSira": 1,
                      "bitSira": 9999,
                      "fonTurAciklama": None,
                      "dil": "TR",
                      "kurucuKod": None,
                      "sira": None,
                      "yon": None,
                  }
                  r = requests.post(url, json=payload, headers=headers, timeout=90, impersonate="chrome124")
                  rec = {"status": r.status_code, "headers": dict(r.headers), "text_head": r.text[:500]}
                  try:
                      data = r.json()
                      rec["data"] = data
                      print("curl", label, r.status_code, len(data.get("resultList") or []))
                  except Exception:
                      pass
                  out["curl_cffi"][label] = rec
          except Exception as exc:
              out["errors"].append({"route": "curl_cffi", "error": repr(exc), "trace": traceback.format_exc()})

          with open("out/tefas-investor-history.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print(json.dumps(out["errors"], ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tefas-investor-history
          path: out/tefas-investor-history.json
