name: Temporary Fintables investor API inspection

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Fintables API
        run: |
          python - <<'PY'
          import os, json, requests
          from urllib.parse import urljoin
          os.makedirs('out', exist_ok=True)
          base='https://api.fintables.com'
          candidates=[
            '/', '/openapi.json', '/swagger.json', '/swagger/', '/docs/', '/redoc/', '/schema/', '/api/schema/',
            '/funds/yield/?fund_type=mutual', '/funds/FNT/', '/funds/FNT', '/funds/detail/FNT/', '/funds/summary/FNT/',
            '/funds/FNT/history/', '/funds/FNT/chart/', '/funds/FNT/graph/', '/funds/FNT/flow/', '/funds/FNT/cash-flow/',
            '/funds/FNT/investor/', '/funds/FNT/investors/', '/funds/FNT/investor-count/', '/funds/FNT/investor_count/',
            '/funds/investor/?code=FNT', '/funds/investors/?code=FNT', '/funds/investor-count/?code=FNT',
            '/funds/investor_count/?code=FNT', '/funds/investor-history/?code=FNT', '/funds/investor_history/?code=FNT',
            '/funds/chart/?code=FNT', '/funds/history/?code=FNT', '/funds/flow/?code=FNT',
            '/funds/investor/?fund_code=FNT', '/funds/investor-count/?fund_code=FNT', '/funds/investor_history/?fund_code=FNT',
            '/funds/FNT/?period=3m', '/funds/FNT/history/?period=3m', '/funds/FNT/chart/?period=3m'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Origin':'https://fintables.com','Referer':'https://fintables.com/'})
          results=[]
          for path in candidates:
            url=urljoin(base,path)
            try:
              r=s.get(url,timeout=30,allow_redirects=True)
              rec={'path':path,'url':url,'status':r.status_code,'ctype':r.headers.get('content-type'),'len':len(r.content),'final_url':r.url,'text':r.text[:2000]}
            except Exception as e:
              rec={'path':path,'url':url,'error':repr(e)}
            results.append(rec)
            print(json.dumps(rec,ensure_ascii=False))
          with open('out/probe.json','w',encoding='utf-8') as f: json.dump(results,f,ensure_ascii=False,indent=2)
          # OPTIONS probes for likely roots
          opts=[]
          for path in ['/funds/','/funds/yield/','/funds/FNT/']:
            try:
              r=s.options(urljoin(base,path),timeout=30)
              opts.append({'path':path,'status':r.status_code,'headers':dict(r.headers),'text':r.text[:4000]})
            except Exception as e: opts.append({'path':path,'error':repr(e)})
          with open('out/options.json','w',encoding='utf-8') as f: json.dump(opts,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fintables-investor-inspect
          path: out
